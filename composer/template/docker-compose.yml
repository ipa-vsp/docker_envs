services:
  ros:
    image: ${IMAGE:-ghcr.io/ipa-vsp/docker_envs:24.04-jazzy}
    user: "${LOCAL_UID:?Export LOCAL_UID using id -u}:${LOCAL_GID:?Export LOCAL_GID using id -g}"
    working_dir: /home/${CONTAINER_USER:-admin}/colcon_ws
    stdin_open: true
    tty: true
    environment:
      HOME: /home/${CONTAINER_USER:-admin}
      WORKSPACE_UMASK: "${WORKSPACE_UMASK:-0022}"
    volumes:
      - type: bind
        source: ${HOST_WS:?Set HOST_WS to an existing absolute workspace path}
        target: /home/${CONTAINER_USER:-admin}/colcon_ws
        bind:
          create_host_path: false
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: bash
