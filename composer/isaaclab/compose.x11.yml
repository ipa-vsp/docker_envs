# GUI override, used together with compose.yml (IsaacLab's x11.yaml pattern).
# Create the wildcard cookie first; see README.md.
services:
  isaaclab:
    environment:
      DISPLAY: "${DISPLAY:?Set DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: /tmp/docker-envs-xauth/xauth
    volumes:
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${XAUTH_DIR:?Set XAUTH_DIR to the directory holding the wildcard cookie}
        target: /tmp/docker-envs-xauth
        read_only: true
        bind:
          create_host_path: false
