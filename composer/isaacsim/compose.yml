services:
  mp0700-6.0.1:
    build:
      context: ../..
      dockerfile: composer/isaacsim/Dockerfile
      args:
        USERNAME: "${CONTAINER_USER:-admin}"
        USER_UID: "${LOCAL_UID:?Export LOCAL_UID using id -u}"
        USER_GID: "${LOCAL_GID:?Export LOCAL_GID using id -g}"
    container_name: mp0700-6.0.1
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    network_mode: host
    environment:
      TZ: "${TZ:-Europe/Berlin}"
      DISPLAY: "${DISPLAY:-}"
      WORKSPACE_UMASK: "${WORKSPACE_UMASK:-0022}"
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
      ROS_LOCALHOST_ONLY: "0"
      OMNI_KIT_ACCEPT_EULA: "YES"
    volumes:
      - type: bind
        source: ${HOST_WS:?Set HOST_WS to an existing workspace}/src
        target: /home/${CONTAINER_USER:-admin}/colcon_ws/src
        bind:
          create_host_path: false
      - type: bind
        source: /tmp/.X11-unix
        target: /tmp/.X11-unix
        read_only: true
        bind:
          create_host_path: false
      - /etc/localtime:/etc/localtime:ro
      # Empty named volumes are populated from these user-owned image paths.
      - isaac-cache-ov:/home/${CONTAINER_USER:-admin}/.cache/ov
      - isaac-cache-pip:/home/${CONTAINER_USER:-admin}/.cache/pip
      - isaac-cache-gl:/home/${CONTAINER_USER:-admin}/.cache/nvidia/GLCache
      - isaac-cache-compute:/home/${CONTAINER_USER:-admin}/.nv/ComputeCache
      - isaac-logs:/home/${CONTAINER_USER:-admin}/.nvidia-omniverse/logs
      - isaac-config:/home/${CONTAINER_USER:-admin}/.nvidia-omniverse/config
      - isaac-data:/home/${CONTAINER_USER:-admin}/.local/share/ov/data
      - isaac-docs:/home/${CONTAINER_USER:-admin}/Documents
      # Kit SDK cache, inside the venv created by the Dockerfile.
      - isaac-cache-kit:/home/${CONTAINER_USER:-admin}/colcon_ws/.venv/lib/python3.12/site-packages/isaacsim/kit/cache
    command: tail -f /dev/null

volumes:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-cache-kit:
  isaac-logs:
  isaac-config:
  isaac-data:
  isaac-docs:
