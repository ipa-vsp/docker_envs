name: canopen
x-runtime: &runtime
  init: true
  user: admin
  cap_add: [NET_ADMIN]
  working_dir: /home/admin/colcon_ws
  stdin_open: true
  tty: true
  environment:
    ROS_DOMAIN_ID: "73"
    ROS_LOCALHOST_ONLY: "1"
    ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  network_mode: bridge
  # Each container gets its own network namespace, including its own vcan0.
  pull_policy: never

services:
  rolling:
    <<: *runtime
    image: docker_envs/canopen:rolling
    build:
      context: .
      args:
        BASE_IMAGE: docker_envs:26.04-rolling
        CANOPEN_BRANCH: master
        CANOPEN_REV: ${CANOPEN_MASTER_REV:-}
        BUILD_JOBS: ${BUILD_JOBS:-4}
  lyrical:
    <<: *runtime
    image: docker_envs/canopen:lyrical
    build:
      context: .
      args:
        BASE_IMAGE: docker_envs:26.04-lyrical
        CANOPEN_BRANCH: master
        CANOPEN_REV: ${CANOPEN_MASTER_REV:-}
        BUILD_JOBS: ${BUILD_JOBS:-4}
  jazzy:
    <<: *runtime
    image: docker_envs/canopen:jazzy
    build:
      context: .
      args:
        BASE_IMAGE: docker_envs:24.04-jazzy
        CANOPEN_BRANCH: master
        CANOPEN_REV: ${CANOPEN_MASTER_REV:-}
        BUILD_JOBS: ${BUILD_JOBS:-4}
  humble:
    <<: *runtime
    image: docker_envs/canopen:humble
    build:
      context: .
      args:
        BASE_IMAGE: docker_envs:22.04-humble
        CANOPEN_BRANCH: humble
        CANOPEN_REV: ${CANOPEN_HUMBLE_REV:-}
        BUILD_JOBS: ${BUILD_JOBS:-4}
