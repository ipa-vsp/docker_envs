version: "3.9"

services:
  coverless-machine:
    image: ghcr.io/ipa-vsp/docker_envs:jazzy
    # container_name: isaac-sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      # - /etc/localtime:/etc/localtime:ro
      # - ../../../machine_description:/home/admin/colcon_ws/src
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: tail -f /dev/null # bash -c "top"

  wbcc-windows:
    image: ghcr.io/ipa-vsp/docker_envs:24.04-jazzy
    # container_name: isaac-sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      # - /etc/localtime:/etc/localtime:ro
      - ../../../rox_fr3_demo:/home/admin/colcon_ws/src
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: tail -f /dev/null # bash -c "top"
