version: "3.9"

services:
  coverless-machine:
    image: ghcr.io/ipa-vsp/docker_envs:jazzy
    # container_name: isaac-sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      # - /etc/localtime:/etc/localtime:ro
      # - ../../../machine_description:/home/admin/colcon_ws/src
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: tail -f /dev/null # bash -c "top"

  wbcc-windows:
    image: docker_envs:24.04-cuda13.3.1-jazzy-mujoco3.13.0-isaaclabrelease-3.0.0-legacy
    # container_name: isaac-sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      # - /etc/localtime:/etc/localtime:ro
      - ../../../rox_fr3_demo:/home/admin/colcon_ws/src
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: tail -f /dev/null # bash -c "top"
  
  rsi-windows:
    image: docker_envs:24.04-cuda13.3.1-jazzy-mujoco3.13.0-isaaclabrelease-3.0.0-legacy
    # container_name: isaac-sim
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      # - /etc/localtime:/etc/localtime:ro
      - ../../../rsi:/home/admin/colcon_ws/rsi
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    command: tail -f /dev/null # bash -c "top"

  # Same as wbcc-windows, plus an SSH server so Zed (or any SSH client) can
  # open the workspace remotely. See docs/usage/zed.rst.
  wbcc-zed-windows:
    image: docker_envs:wbcc-zed
    build:
      context: .
      dockerfile: Dockerfile.zed
      args:
        BASE_IMAGE: docker_envs:24.04-cuda13.3.1-jazzy-mujoco3.13.0-isaaclabrelease-3.0.0-legacy
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    network_mode: host
    stdin_open: true
    tty: true
    # sshd must start as root; SSH logins still happen as admin.
    user: root
    volumes:
      - /run/desktop/mnt/host/wslg:/tmp
      - ../../../rox_fr3_demo:/home/admin/colcon_ws/src
      # Public key allowed to log in as admin. Override with ZED_SSH_PUBKEY.
      - ${ZED_SSH_PUBKEY:-${USERPROFILE}/.ssh/id_ed25519.pub}:/home/admin/.ssh/authorized_keys:ro
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/runtime-dir
      - PULSE_SERVER=/tmp/PulseServer
      - ROS_DOMAIN_ID=73
    entrypoint: /usr/local/bin/scripts/workspace-entrypoint.sh
    # SSH logins start with an empty environment, so hand this container's
    # (DISPLAY, ROS_DOMAIN_ID, PATH, ...) to them via /etc/environment.
    command: >-
      sh -c "env | grep -vE '^(HOME|HOSTNAME|PWD|SHLVL|USER|_)=' > /etc/environment
      && exec /usr/sbin/sshd -D -e -p ${ZED_SSH_PORT:-2222}"
