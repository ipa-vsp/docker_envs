# ROS 2 Jazzy on a macOS host. Two ways to see a GUI; pick by what you run.
#
#   canopen_ws      XQuartz on the Mac. Windows land on the Mac desktop.
#                   Works for rqt, rqt_graph and other plain-Qt tools.
#                   Does NOT work for rviz2 / gz sim / MuJoCo: XQuartz offers
#                   no usable GLX fbConfig, so Ogre fails with
#                   "No matching fbConfigs or visuals found".
#
#   canopen_ws_vnc  X server inside the container, exported over VNC. Works for
#                   everything, including rviz2. Needs no XQuartz; connect with
#                   the Mac's built-in Screen Sharing to vnc://localhost:5901.
#
# Full guide, including the XQuartz setup: docs/usage/gui.rst
services:
  canopen_ws:
    image: ghcr.io/ipa-vsp/docker_envs:24.04-jazzy
    user: admin:1000
    stdin_open: true
    privileged: true
    tty: true
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # - ../../../ros2_canopen:/home/admin/colcon_ws/src
    environment:
      # Never $DISPLAY here: on macOS that is a launchd socket path
      # (/var/run/com.apple.launchd.*/org.xquartz:0) that means nothing to Linux.
      # Before `up`, on the Mac:
      #   defaults write org.xquartz.X11 nolisten_tcp 0
      #   open -a XQuartz          # restart it if it was already running
      #   xhost + ::1              # IPv6 loopback: how Docker Desktop arrives
      - DISPLAY=${MACOS_DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=73
    # entrypoint: /usr/local/bin/scripts/ros2_entrypoint.sh
    command: tail -f /dev/null # bash -c "top"

  canopen_ws_vnc:
    build:
      context: .
      dockerfile: Dockerfile.vnc
      args:
        BASE_IMAGE: ghcr.io/ipa-vsp/docker_envs:24.04-jazzy
    image: docker_envs:24.04-jazzy-vnc
    user: admin:1000
    stdin_open: true
    privileged: true
    tty: true
    # Not network_mode: host. Docker Desktop's "host" network is the Linux VM's,
    # so the Mac could not reach port 5901 and `ports:` would be ignored.
    # ROS 2 discovery still works between containers on this network.
    ports:
      - "127.0.0.1:5901:5901"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # - ../../../ros2_canopen:/home/admin/colcon_ws/src
    environment:
      - ROS_DOMAIN_ID=73
      - VNC_GEOMETRY=1600x1000
      # Set here, not only in the entrypoint, so `docker compose exec` shells
      # inherit them — exec does not run the entrypoint.
      - DISPLAY=:99
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
      # - VNC_PASSWORD=change-me   # otherwise the port is loopback-only, no auth
    entrypoint: /usr/local/bin/scripts/vnc-entrypoint.sh
    command: tail -f /dev/null
