name: GHCR Cleanup

# Removes untagged versions that no tag references any more: digests left behind
# when a tag is re-pushed, orphaned per-arch images, and superseded build caches.
# Per-arch images that a multi-arch tag still points at are kept, and nothing
# tagged is ever deleted. Intermediate stage packages (docker_envs/base, /ros,
# /moveit) are removed by ros2-staged.yml itself.

on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:
    inputs:
      dry-run:
        description: List what would be deleted without deleting it
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    name: Remove unreferenced untagged versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: docker_envs,docker_envs/buildcache
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
          # Scheduled runs have no inputs and delete for real.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
