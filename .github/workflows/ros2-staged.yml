name: Build ROS Images in Stages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'creator/**'
      - '.dockerignore'
      - '.github/workflows/ros2-staged.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'creator/**'
      - '.dockerignore'
      - '.github/workflows/ros2-staged.yml'

# All publishing runs share intermediate tags; do not cancel one during cleanup.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-pr:
    name: Validate ROS stack without publishing
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-24.04, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
        target:
          - { os: "24.04", ros: rolling, usage: skip }
          - { os: "24.04", ros: kilted, usage: skip }
          - { os: "24.04", ros: jazzy, usage: skip }
          - { os: "22.04", ros: humble, usage: skip }
          - { os: "26.04", ros: lyrical, usage: skip }
          - { os: "24.04", ros: kilted, usage: manipulation }
          - { os: "24.04", ros: jazzy, usage: manipulation }
          - { os: "22.04", ros: humble, usage: manipulation }
    steps:
      - uses: actions/checkout@v7
      # The docker driver keeps each intermediate image available to the next build.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the complete local stack
        env:
          OS_VERSION: ${{ matrix.target.os }}
          ROS_DISTRO: ${{ matrix.target.ros }}
          USAGE: ${{ matrix.target.usage }}
        run: |
          creator/scripts/run_env.sh -b -o "$OS_VERSION" -v "$ROS_DISTRO" \
            -u "$USAGE" -U 1000 -G 1000 -i docker-envs-pr:ros
      - name: Check ROS and user setup
        run: |
          docker run --rm --user admin docker-envs-pr:ros bash -c \
            'test "$(id -u)" = 1000 && test -x /usr/local/bin/scripts/workspace-entrypoint.sh && source /opt/ros/$ROS_DISTRO/setup.bash && ros2 pkg prefix rclcpp'

  build-base:
    if: ${{ github.event_name != 'pull_request' }}
    name: Build Base Image
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-24.04, docker: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, docker: linux/arm64, arch: arm64 }
        os: ["24.04", "22.04", "26.04"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.base
          push: true
          platforms: ${{ matrix.platform.docker }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-base-${{ matrix.os }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-base-${{ matrix.os }}-${{ matrix.platform.arch }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ matrix.os }}-${{ matrix.platform.arch }}
          build-args: |
            BASE_IMAGE=${{ matrix.os }}

  build-ros:
    if: ${{ github.event_name != 'pull_request' }}
    name: Add ROS
    runs-on: ${{ matrix.platform.runner }}
    needs: build-base
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-24.04, docker: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, docker: linux/arm64, arch: arm64 }
        target:
          - { os: "24.04", ros: rolling }
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
          - { os: "26.04", ros: lyrical }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ROS layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/ros2/Dockerfile.${{ matrix.target.ros }}
          push: true
          platforms: ${{ matrix.platform.docker }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-ros-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-ros-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ matrix.target.os }}-${{ matrix.platform.arch }}

  build-moveit:
    if: ${{ github.event_name != 'pull_request' }}
    name: Add MoveIt
    runs-on: ${{ matrix.platform.runner }}
    needs: build-ros
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-24.04, docker: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, docker: linux/arm64, arch: arm64 }
        # lyrical (26.04) omitted: no MoveIt debs published for it yet.
        target:
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build MoveIt layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/usage/Dockerfile.moveit
          push: true
          platforms: ${{ matrix.platform.docker }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-moveit-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-moveit-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/moveit:${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
            ROS_DISTRO=${{ matrix.target.ros }}

  finalize-base-ros-user:
    if: ${{ github.event_name != 'pull_request' }}
    name: Final User Image (ROS only)
    runs-on: ${{ matrix.platform.runner }}
    needs: build-ros
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-24.04, docker: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, docker: linux/arm64, arch: arm64 }
        target:
          - { os: "24.04", ros: rolling }
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
          - { os: "26.04", ros: lyrical }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final user image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.user
          platforms: ${{ matrix.platform.docker }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-user-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-user-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }},mode=max
          # Push without a tag; the merge job assembles the multi-arch manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=admin
            ROS_DISTRO=${{ matrix.target.ros }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo -n "${DIGEST}" > "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-ros-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  finalize-base-ros-moveit-user:
    if: ${{ github.event_name != 'pull_request' }}
    name: Final User Image (MoveIt)
    runs-on: ${{ matrix.platform.runner }}
    needs: build-moveit
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - { runner: ubuntu-24.04, docker: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, docker: linux/arm64, arch: arm64 }
        # lyrical (26.04) omitted: no MoveIt debs published for it yet.
        target:
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final MoveIt image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.user
          platforms: ${{ matrix.platform.docker }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-moveit-user-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-moveit-user-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }},mode=max
          # Push without a tag; the merge job assembles the multi-arch manifest.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/moveit:${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=admin
            ROS_DISTRO=${{ matrix.target.ros }}
      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          echo -n "${DIGEST}" > "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-moveit-${{ matrix.target.os }}-${{ matrix.target.ros }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifests:
    if: ${{ github.event_name != 'pull_request' }}
    name: Publish multi-arch tag
    runs-on: ubuntu-latest
    needs:
      - finalize-base-ros-user
      - finalize-base-ros-moveit-user
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { prefix: ros, os: "24.04", ros: rolling, tag: "24.04-rolling" }
          - { prefix: ros, os: "24.04", ros: kilted, tag: "24.04-kilted" }
          - { prefix: ros, os: "24.04", ros: jazzy, tag: "24.04-jazzy" }
          - { prefix: ros, os: "22.04", ros: humble, tag: "22.04-humble" }
          - { prefix: ros, os: "26.04", ros: lyrical, tag: "26.04-lyrical" }
          - { prefix: moveit, os: "24.04", ros: kilted, tag: "24.04-kilted-moveit" }
          - { prefix: moveit, os: "24.04", ros: jazzy, tag: "24.04-jazzy-moveit" }
          - { prefix: moveit, os: "22.04", ros: humble, tag: "22.04-humble-moveit" }
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.prefix }}-${{ matrix.os }}-${{ matrix.ros }}-*
          path: /tmp/digests
          merge-multiple: true
      - name: Create manifest list
        env:
          TARGET: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(find /tmp/digests -type f -printf "${SOURCE}@sha256:%f\n")
          if [[ ${#refs[@]} -eq 0 ]]; then
            echo "No digests found for ${TARGET}" >&2
            exit 1
          fi
          docker buildx imagetools create -t "${TARGET}" "${refs[@]}"
          docker buildx imagetools inspect "${TARGET}"

  cleanup-intermediates:
    name: Delete intermediate stage packages
    runs-on: ubuntu-latest
    needs:
      - publish-manifests
    # Only the final user images are meant to persist. Delete the intermediate
    # secondary packages once every final image has been pushed. Skipped on PRs
    # (which don't push). All required final jobs must succeed. Versions protected
    # by GitHub's public download limit must remain.
    if: ${{ success() && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    env:
      INTERMEDIATE_PACKAGES: '["docker_envs/base","docker_envs/ros","docker_envs/moveit"]'
    steps:
      - name: Delete all versions of intermediate packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          OWNER_TYPE=$(gh api "/repos/${REPO}" --jq '.owner.type')
          BASE_PATH="/users/${OWNER}"
          if [[ "${OWNER_TYPE}" == "Organization" ]]; then
            BASE_PATH="/orgs/${OWNER}"
          fi

          echo "${INTERMEDIATE_PACKAGES}" | jq -r '.[]' | while read -r pkg; do
            [[ -z "${pkg}" ]] && continue
            PKG_PATH="${pkg//\//%2F}" # URL-encode slashes in package names
            echo "Deleting all versions of intermediate package '${pkg}' for ${OWNER_TYPE} '${OWNER}'"

            if ! VERSIONS=$(gh api --paginate "${BASE_PATH}/packages/container/${PKG_PATH}/versions?per_page=100" --jq '.[].id'); then
              echo "Package '${pkg}' not found. Skipping."
              continue
            fi
            if [[ -z "${VERSIONS}" ]]; then
              echo "No versions found in ${pkg}; skipping."
              continue
            fi

            RETAINED_VERSIONS=false
            while read -r id; do
              [[ -z "${id}" ]] && continue
              if DELETE_OUTPUT=$(gh api -X DELETE "${BASE_PATH}/packages/container/${PKG_PATH}/versions/${id}" 2>&1); then
                continue
              fi
              if [[ "${DELETE_OUTPUT}" == *"(HTTP 400)"* && "${DELETE_OUTPUT}" == *"Publicly visible package versions with more than 5000 downloads cannot be deleted"* ]]; then
                echo "::warning::Retaining ${pkg} version ${id}: GitHub prevents deletion above 5000 public downloads."
                RETAINED_VERSIONS=true
              else
                printf '%s\n' "${DELETE_OUTPUT}" >&2
                exit 1
              fi
            done <<< "${VERSIONS}"

            # Do not attempt to delete a package that still has protected versions.
            [[ "${RETAINED_VERSIONS}" == true ]] && continue
            # Once the last version is removed the package itself is deleted; ignore 404s.
            gh api -X DELETE "${BASE_PATH}/packages/container/${PKG_PATH}" 2>/dev/null || true
          done
