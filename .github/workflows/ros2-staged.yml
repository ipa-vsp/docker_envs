name: Build ROS Images in Stages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'creator/**'
      - '.dockerignore'
      - '.github/workflows/ros2-staged.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'creator/**'
      - '.dockerignore'
      - '.github/workflows/ros2-staged.yml'

# All publishing runs share intermediate tags; do not cancel one during cleanup.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-pr:
    name: Validate ROS stack without publishing
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "24.04", ros: rolling, usage: skip }
          - { os: "24.04", ros: kilted, usage: skip }
          - { os: "24.04", ros: jazzy, usage: skip }
          - { os: "22.04", ros: humble, usage: skip }
          - { os: "26.04", ros: lyrical, usage: skip }
          - { os: "24.04", ros: kilted, usage: manipulation }
          - { os: "24.04", ros: jazzy, usage: manipulation }
          - { os: "22.04", ros: humble, usage: manipulation }
    steps:
      - uses: actions/checkout@v7
      # The docker driver keeps each intermediate image available to the next build.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build the complete local stack
        env:
          OS_VERSION: ${{ matrix.os }}
          ROS_DISTRO: ${{ matrix.ros }}
          USAGE: ${{ matrix.usage }}
        run: |
          creator/scripts/run_env.sh -b -o "$OS_VERSION" -v "$ROS_DISTRO" \
            -u "$USAGE" -U 1000 -G 1000 -i docker-envs-pr:ros
      - name: Check ROS and user setup
        run: |
          docker run --rm --user admin docker-envs-pr:ros bash -c \
            'test "$(id -u)" = 1000 && test -x /usr/local/bin/scripts/workspace-entrypoint.sh && source /opt/ros/$ROS_DISTRO/setup.bash && ros2 pkg prefix rclcpp'

  build-base:
    if: ${{ github.event_name != 'pull_request' }}
    name: Build Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        os: ["24.04", "22.04", "26.04"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build base layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.base
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-base-${{ matrix.os }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-base-${{ matrix.os }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ matrix.os }}
          build-args: |
            BASE_IMAGE=${{ matrix.os }}

  build-ros:
    if: ${{ github.event_name != 'pull_request' }}
    name: Add ROS
    runs-on: ubuntu-latest
    needs: build-base
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { os: "24.04", ros: rolling }
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
          - { os: "26.04", ros: lyrical }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select ROS Dockerfile
        run: echo "ROS_FILE=creator/ros2/Dockerfile.${{ matrix.ros }}" >> $GITHUB_ENV
      - name: Build ROS layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.ROS_FILE }}
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-ros-${{ matrix.os }}-${{ matrix.ros }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-ros-${{ matrix.os }}-${{ matrix.ros }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.os }}-${{ matrix.ros }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:${{ matrix.os }}

  build-moveit:
    if: ${{ github.event_name != 'pull_request' }}
    name: Add MoveIt
    runs-on: ubuntu-latest
    needs: build-ros
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # lyrical (26.04) omitted: no MoveIt debs published for it yet.
        include:
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build MoveIt layer
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/usage/Dockerfile.moveit
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-moveit-${{ matrix.os }}-${{ matrix.ros }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-build-moveit-${{ matrix.os }}-${{ matrix.ros }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/moveit:${{ matrix.os }}-${{ matrix.ros }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.os }}-${{ matrix.ros }}
            ROS_DISTRO=${{ matrix.ros }}

  finalize-base-ros-user:
    if: ${{ github.event_name != 'pull_request' }}
    name: Final User Image (ROS only)
    runs-on: ubuntu-latest
    needs: build-ros
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { os: "24.04", ros: rolling }
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
          - { os: "26.04", ros: lyrical }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final user image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.user
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-user-${{ matrix.os }}-${{ matrix.ros }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-user-${{ matrix.os }}-${{ matrix.ros }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.os }}-${{ matrix.ros }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/ros:${{ matrix.os }}-${{ matrix.ros }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=admin
            ROS_DISTRO=${{ matrix.ros }}

  finalize-base-ros-moveit-user:
    if: ${{ github.event_name != 'pull_request' }}
    name: Final User Image (MoveIt)
    runs-on: ubuntu-latest
    needs: build-moveit
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # lyrical (26.04) omitted: no MoveIt debs published for it yet.
        include:
          - { os: "24.04", ros: kilted }
          - { os: "24.04", ros: jazzy }
          - { os: "22.04", ros: humble }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build final MoveIt image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: creator/common/Dockerfile.user
          push: true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-moveit-user-${{ matrix.os }}-${{ matrix.ros }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/buildcache:ros-finalize-base-ros-moveit-user-${{ matrix.os }}-${{ matrix.ros }},mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ matrix.os }}-${{ matrix.ros }}-moveit
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/moveit:${{ matrix.os }}-${{ matrix.ros }}
            USER_UID=1000
            USER_GID=1000
            USERNAME=admin
            ROS_DISTRO=${{ matrix.ros }}

  cleanup-intermediates:
    name: Delete intermediate stage packages
    runs-on: ubuntu-latest
    needs:
      - finalize-base-ros-user
      - finalize-base-ros-moveit-user
    # Only the final user images are meant to persist. Delete the intermediate
    # secondary packages once every final image has been pushed. Skipped on PRs
    # (which don't push). All required final jobs must succeed.
    if: ${{ success() && github.event_name != 'pull_request' }}
    permissions:
      contents: read
      packages: write
    env:
      INTERMEDIATE_PACKAGES: '["docker_envs/base","docker_envs/ros","docker_envs/moveit"]'
    steps:
      - name: Delete all versions of intermediate packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OWNER="${REPO%%/*}"
          OWNER_TYPE=$(gh api "/repos/${REPO}" --jq '.owner.type')
          BASE_PATH="/users/${OWNER}"
          if [[ "${OWNER_TYPE}" == "Organization" ]]; then
            BASE_PATH="/orgs/${OWNER}"
          fi

          echo "${INTERMEDIATE_PACKAGES}" | jq -r '.[]' | while read -r pkg; do
            [[ -z "${pkg}" ]] && continue
            PKG_PATH="${pkg//\//%2F}" # URL-encode slashes in package names
            echo "Deleting all versions of intermediate package '${pkg}' for ${OWNER_TYPE} '${OWNER}'"

            if ! VERSIONS=$(gh api --paginate "${BASE_PATH}/packages/container/${PKG_PATH}/versions?per_page=100" --jq '.[].id'); then
              echo "Package '${pkg}' not found. Skipping."
              continue
            fi
            if [[ -z "${VERSIONS}" ]]; then
              echo "No versions found in ${pkg}; skipping."
              continue
            fi

            echo "${VERSIONS}" | while read -r id; do
              [[ -z "${id}" ]] && continue
              gh api -X DELETE "${BASE_PATH}/packages/container/${PKG_PATH}/versions/${id}"
            done

            # Once the last version is removed the package itself is deleted; ignore 404s.
            gh api -X DELETE "${BASE_PATH}/packages/container/${PKG_PATH}" 2>/dev/null || true
          done
