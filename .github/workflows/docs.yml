name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      # The Sphinx site itself.
      - 'docs/**'
      # Guides imported into the site by docs/conf.py (GUIDES).
      - 'README.md'
      - '**/README.md'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - '**/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# One docs build per ref. Pushes to main are never cancelled, so a deployment
# is not interrupted halfway.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # `make strict` is `sphinx-build -W --keep-going`: a bad cross-reference,
      # a page missing from a toctree or a guide conf.py cannot import fails
      # the job instead of silently shipping a broken page.
      - name: Build documentation
        run: make -C docs clean strict

      - name: Upload site for review
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

      - name: Upload site for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # deploy to Pages
      id-token: write   # verify the deployment origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
