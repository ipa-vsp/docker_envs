name: GUI builder and AppImage

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'gui/**'
      - 'creator/scripts/lib/query.sh'
      - 'tests/test_gui_*.py'
      - '.github/workflows/gui-appimage.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'creator/scripts/lib/query.sh'
      - 'tests/test_gui_*.py'
      - '.github/workflows/gui-appimage.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Qt needs these even for the offscreen platform plugin.
  QT_RUNTIME_PACKAGES: libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libglib2.0-0

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -qq ${{ env.QT_RUNTIME_PACKAGES }}
      - name: Install the application
        run: python -m pip install ./gui
      - name: Check shell syntax
        run: bash -n creator/scripts/lib/query.sh
      - name: Run the GUI test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -p 'test_gui_*.py' -v
      - name: Self-test against this checkout
        env:
          QT_QPA_PLATFORM: offscreen
        run: docker-envs-gui --check

  appimage:
    name: AppImage
    needs: test
    # An AppImage inherits the glibc of its build host, so build on the oldest
    # release we want it to start on rather than on ubuntu-latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -qq ${{ env.QT_RUNTIME_PACKAGES }}
      - name: Install build dependencies
        run: python -m pip install ./gui pyinstaller
      - name: Build the AppImage
        run: gui/packaging/build-appimage.sh
      - name: Report the result
        run: ls -lh gui/dist/*.AppImage*
      - uses: actions/upload-artifact@v4
        with:
          name: docker-envs-gui-appimage
          path: |
            gui/dist/*.AppImage
            gui/dist/*.AppImage.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-envs-gui-appimage
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          fail_on_unmatched_files: true
