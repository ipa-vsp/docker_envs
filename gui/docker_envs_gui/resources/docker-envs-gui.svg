<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>docker_envs Image Builder</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc0ff"/>
      <stop offset="1" stop-color="#2496ed"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9de8"/>
      <stop offset="1" stop-color="#1573c0"/>
    </linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c6fae"/>
      <stop offset="1" stop-color="#0f4f80"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2530"/>
      <stop offset="1" stop-color="#111721"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#plate)"/>

  <!-- Three stacked layers, the shape of a staged image build. -->
  <g stroke="#0b1119" stroke-width="4" stroke-linejoin="round">
    <path d="M128 158 L206 194 L128 230 L50 194 Z" fill="url(#low)"/>
    <path d="M128 116 L206 152 L128 188 L50 152 Z" fill="url(#mid)"/>
    <path d="M128 74 L206 110 L128 146 L50 110 Z" fill="url(#top)"/>
  </g>

  <!-- The build arrow entering the stack. -->
  <g fill="#e8f4ff">
    <rect x="120" y="20" width="16" height="30" rx="6"/>
    <path d="M128 66 L110 42 L146 42 Z"/>
  </g>
</svg>
